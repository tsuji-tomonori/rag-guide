name: Resolve PR 8 after PR 7

on:
  push:
    branches:
      - agent/rag-pdf-fact-check-v1-1-1-20260731
    paths:
      - .github/workflows/resolve-pr8-after-pr7.yml

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge main and resolve the known overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Resolving conflicts:\n'
            printf ' - %s\n' "${conflicts[@]}"

            for path in "${conflicts[@]}"; do
              case "$path" in
                "docs/章構成.md")
                  git checkout --theirs -- "$path"
                  ;;
                "docs/10.AWSで設計・実装する/10.2.サービス責務と接続.md")
                  git rm -f -- "$path" || true
                  ;;
                *)
                  git checkout --ours -- "$path" || true
                  ;;
              esac
            done
          fi

          # Keep the PR-side rename and content for 10.2.
          git checkout HEAD -- "docs/10.AWSで設計・実装する/10.2.Embeddingとvector indexを設定する.md"
          git rm -f -- "docs/10.AWSで設計・実装する/10.2.サービス責務と接続.md" 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          heading = re.compile(r'^(#{1,6}\s+)(\d+(?:\.\d+)+)(?:\.)?\s+(.*)$')
          list_item = re.compile(r'^(\s*-\s+)(\d+(?:\.\d+)+)(?:\.)?\s+(.*)$')

          for path in Path('docs').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              lines = []
              for line in text.splitlines(keepends=True):
                  newline = '\n' if line.endswith('\n') else ''
                  body = line[:-1] if newline else line
                  match = heading.match(body)
                  if match:
                      body = f'{match.group(1)}{match.group(2)}. {match.group(3)}'
                  else:
                      match = list_item.match(body)
                      if match:
                          body = f'{match.group(1)}{match.group(2)}. {match.group(3)}'
                  lines.append(body + newline)
              updated = ''.join(lines)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          structure = Path('docs/章構成.md')
          text = structure.read_text(encoding='utf-8')
          old = '引用数は2026年7月28日時点の参考値とし、発表時期、独立した追試、対象タスク、比較条件を併記します。'
          new = '引用件数のように変動する値を記録する場合は、確認日だけでなく、取得元、検索式、論文のcanonical ID、取得時刻、保存した生応答への相対パスとSHA-256を証跡へ残し、本文の採否を件数だけで決めません。'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('docs/章構成.md: citation evidence policy line was not found')
          structure.write_text(text, encoding='utf-8')
          PY

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "merge: integrate main after PR #7"
          fi

      - name: Validate merged source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python3 -m py_compile \
            print/build.py \
            skills/rag-pdf-fact-check/scripts/inspect_pdf.py \
            skills/rag-pdf-fact-check/scripts/validate_review.py
          python3 skills/rag-pdf-fact-check/scripts/validate_review.py \
            skills/rag-pdf-fact-check/examples/review.example.json
          python3 print/build.py

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/resolve-pr8-after-pr7.yml
          git commit -m "chore: remove temporary PR conflict resolver"
          git push origin HEAD:agent/rag-pdf-fact-check-v1-1-1-20260731
