name: Validate PDF fact-check skill

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/rag-pdf-fact-check/**"
      - ".github/workflows/validate-fact-check-skill.yml"
  push:
    branches: [main]
    paths:
      - "skills/rag-pdf-fact-check/**"
      - ".github/workflows/validate-fact-check-skill.yml"

permissions:
  contents: read

jobs:
  validate-skill:
    name: Validate skill scripts and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          persist-credentials: false

      - name: Install PDF dependency
        run: python3 -m pip install --disable-pip-version-check pymupdf

      - name: Compile helper scripts
        run: |
          python3 -m py_compile \
            skills/rag-pdf-fact-check/scripts/inspect_pdf.py \
            skills/rag-pdf-fact-check/scripts/validate_review.py

      - name: Validate example review
        run: >-
          python3 skills/rag-pdf-fact-check/scripts/validate_review.py
          skills/rag-pdf-fact-check/examples/review.example.json

      - name: Smoke-test full-page rendering
        run: |
          mkdir -p /tmp/rag-pdf-skill
          python3 - <<'PY'
          import fitz

          document = fitz.open()
          for number in range(1, 3):
              page = document.new_page()
              page.insert_text((72, 72), f"Fact-check smoke test page {number}")
          document.save("/tmp/rag-pdf-skill/sample.pdf")
          PY
          python3 skills/rag-pdf-fact-check/scripts/inspect_pdf.py \
            /tmp/rag-pdf-skill/sample.pdf \
            --out-dir /tmp/rag-pdf-skill/pages \
            --json /tmp/rag-pdf-skill/inspection.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("/tmp/rag-pdf-skill/inspection.json").read_text(encoding="utf-8")
          )
          assert manifest["pdf"]["page_count"] == 2
          assert len(manifest["pdf_inspection"]) == 2
          assert all(
              row["visual_status"] == "REVIEW_REQUIRED"
              for row in manifest["pdf_inspection"]
          )
          assert len(list(Path("/tmp/rag-pdf-skill/pages").glob("page-*.png"))) == 2
          PY
