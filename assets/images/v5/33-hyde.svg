<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">HyDE：仮想文書を手掛かりに実文書を探す</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  質問</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">電池を長持ちさせたい</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  仮想文書を生成</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">LLMが説明文を作る</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">例：画面の明るさを下げる</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">これは検索の手掛かり</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  埋め込みへ変換</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">仮想文書 → ベクトル</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">文書らしい表現で比較</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  実文書を検索</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">近いマニュアルを取得</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">回答と引用は実文書で確認</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">原手法：生成 → 符号化 → 密検索。本書の併用案では元質問の検索も残す。</text></g></svg>
