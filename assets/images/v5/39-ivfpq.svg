<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">IVFとPQ：探索する領域と保存量を減らす</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  IVF：領域を作る</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">文書ベクトルを</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">近い中心の領域へ割り当てる</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  PQ：表現を圧縮</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">ベクトルを部分へ分ける</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">各部分を代表値の番号へ</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">例：4次元 → 2つの番号</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  近い領域を選ぶ</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">質問に近い中心を探す</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">選んだ領域内を探索</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">領域数で回収率を調整</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  距離を近似して選ぶ</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">代表値との距離を合計</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">必要に応じて元ベクトルで</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">上位候補を再計算</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">IVFは候補の範囲、PQはベクトル表現を変える。組み合わせても単独でも使える。</text></g></svg>
