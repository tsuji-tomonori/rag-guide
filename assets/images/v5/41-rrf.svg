<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">RRF：二つの順位一覧を一つへ統合する</text><rect x="55" y="130" width="1290" height="105" fill="#e8e8e8" stroke="#888" stroke-width="2"/><text x="215" y="196" font-size="34" text-anchor="middle" font-weight="700">候補</text><text x="538" y="196" font-size="34" text-anchor="middle" font-weight="700">疎検索の順位</text><text x="861" y="196" font-size="34" text-anchor="middle" font-weight="700">密検索の順位</text><text x="1184" y="196" font-size="34" text-anchor="middle" font-weight="700">RRFスコア</text><rect x="55" y="235" width="1290" height="105" fill="white" stroke="#888" stroke-width="2"/><text x="215" y="301" font-size="34" text-anchor="middle" font-weight="400">A</text><text x="538" y="301" font-size="34" text-anchor="middle" font-weight="400">1</text><text x="861" y="301" font-size="34" text-anchor="middle" font-weight="400">3</text><text x="1184" y="301" font-size="34" text-anchor="middle" font-weight="400">0.03227</text><rect x="55" y="340" width="1290" height="105" fill="white" stroke="#888" stroke-width="2"/><text x="215" y="406" font-size="34" text-anchor="middle" font-weight="400">B</text><text x="538" y="406" font-size="34" text-anchor="middle" font-weight="400">2</text><text x="861" y="406" font-size="34" text-anchor="middle" font-weight="400">1</text><text x="1184" y="406" font-size="34" text-anchor="middle" font-weight="400">0.03252</text><rect x="55" y="445" width="1290" height="105" fill="white" stroke="#888" stroke-width="2"/><text x="215" y="511" font-size="34" text-anchor="middle" font-weight="400">C</text><text x="538" y="511" font-size="34" text-anchor="middle" font-weight="400">3</text><text x="861" y="511" font-size="34" text-anchor="middle" font-weight="400">2</text><text x="1184" y="511" font-size="34" text-anchor="middle" font-weight="400">0.03200</text><text x="55" y="630" font-size="36" text-anchor="start" font-weight="400">各順位rから 1 / (60 + r) を計算し、候補ごとに合計</text><text x="55" y="705" font-size="36" text-anchor="start" font-weight="400">B：1/62 + 1/61 = 0.03252 → 統合後は1位</text><path d="M700 750 L700 805" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><text x="700" y="870" font-size="42" text-anchor="middle" font-weight="700">統合順位：B → A → C</text><text x="55" y="940" font-size="32" text-anchor="start" font-weight="400">説明用の数値。定数60は比較実験で調整する設定値。</text></g></svg>
