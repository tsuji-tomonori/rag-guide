<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">検索評価：同じ結果を異なる観点で測る</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  正解と検索結果</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">必要な根拠：A,B,C</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">上位3件：X,A,B</text><text x="83" y="311" font-size="34" text-anchor="start" font-weight="400">関連ありはAとBの2件</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  集合の割合</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">Recall@3：2/3</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">Precision@3：2/3</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">必要数と取得数を区別</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  最初の正解と全根拠</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">最初の正解Aは2位</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">逆順位：1/2</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">Hit@3は成功、全根拠は不足</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  質問全体で集計</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">逆順位を平均するとMRR</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">根拠の重要度も扱うなら</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">nDCGで順位を評価</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">説明用の一質問。正解文書が複数あると、Hit@kとRecall@kは異なる。</text></g></svg>
