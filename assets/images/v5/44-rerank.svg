<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="958" viewBox="0 0 1400 958"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">再順位付け：質問と候補を一緒に読み直す</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  広く候補を取得</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">疎検索・密検索 → 候補A,B,C</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">例：製品Aの第3版の手順</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  質問と本文を照合</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">Cross-encoderへ対で入力</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">A：第2版、B：第3版</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">C：同名の別製品</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  関連度で並べ替え</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">質問と条件が合うBを優先</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">順位：B → A → C</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">必要な件数を選ぶ</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  根拠として整える</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">出典と条件を付けてLLMへ</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">取得数と採用数を別に記録</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">Pointwiseは候補単位、Pairwiseは二候補の比較、Listwiseは一覧単位で順位を作る</text><text x="55" y="918" font-size="32" text-anchor="start" font-weight="400">。</text></g></svg>
