<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">Late Chunking：文脈を読んでから区間をまとめる</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  全文と分割位置</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">製品Aは防水仕様。</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">それでも海水は対象外。</text><text x="83" y="311" font-size="34" text-anchor="start" font-weight="400">二文の境界を記録</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  全文を符号化</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">長文対応モデルで一度に読む</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">それ＝製品Aという文脈も</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">各トークン表現へ反映</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  区間ごとに集約</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">第1文の表現をまとめる</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">第2文の表現をまとめる</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">区間ごとにベクトルを作る</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  区間を検索</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">質問ベクトルと比較</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">原文の区間を取得</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">必要に応じて前後も読む</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">先に区間を分けて個別に符号化する通常の分割と、処理の順序が異なる。</text></g></svg>
