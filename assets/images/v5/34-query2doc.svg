<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">Query2doc：擬似文書で検索語を広げる</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  短い質問</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">スマホの省電力設定</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  擬似文書を生成</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">画面の明るさ、通信、</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">電池の消費について説明</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  検索表現を作る</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">元質問に生成文を追加</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">疎検索：追加語を使う</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">密検索：拡張文を符号化</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  実資料から答える</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">検索で得た設定手順を読む</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">数値や対象機種を原文で確認</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">HyDEとの違いは検索表現の作り方。生成文は検索用の補助情報として扱う。</text></g></svg>
