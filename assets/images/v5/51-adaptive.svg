<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">Adaptive-RAGとFLARE：検索する時点を選ぶ</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  Adaptive-RAG：入力</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">質問の複雑さを分類</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">質問の段階で経路を選ぶ</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  処理経路を選択</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">検索を省いた生成</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">一回検索して生成</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">反復検索して生成</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  FLARE：生成途中</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">次に書く文をいったん予測</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">低確信のトークンを検知</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">予測文から検索文を作る</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  根拠を補って再生成</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">取得文書を使い文を作り直す</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">次の文でも必要性を判定</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">上段と下段は別の手法。上段は質問単位、下段は生成途中の文単位で判断する。</text></g></svg>
