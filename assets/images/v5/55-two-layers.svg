<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="975" viewBox="0 0 1400 975"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">四工程と二層：処理の目的と実行の責任を分ける</text><text x="55" y="150" font-size="36" text-anchor="start" font-weight="700">Batch Layer：資料を準備する</text><text x="55" y="570" font-size="36" text-anchor="start" font-weight="700">Real-time Layer：質問へ応答する</text><rect x="55" y="200" width="370" height="230" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="252" font-size="36" text-anchor="start" font-weight="700">資料</text><text x="83" y="305" font-size="34" text-anchor="start" font-weight="400">原文・版・権限</text><rect x="515" y="200" width="370" height="230" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="543" y="252" font-size="36" text-anchor="start" font-weight="700">検索前処理</text><text x="543" y="305" font-size="34" text-anchor="start" font-weight="400">解析 → 分割</text><text x="543" y="348" font-size="34" text-anchor="start" font-weight="400">埋め込みを作成</text><rect x="975" y="200" width="370" height="230" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="1003" y="252" font-size="36" text-anchor="start" font-weight="700">検索索引</text><text x="1003" y="305" font-size="34" text-anchor="start" font-weight="400">語とベクトル</text><text x="1003" y="348" font-size="34" text-anchor="start" font-weight="400">出典と権限を保持</text><rect x="55" y="630" width="370" height="230" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="682" font-size="36" text-anchor="start" font-weight="700">質問の準備</text><text x="83" y="735" font-size="34" text-anchor="start" font-weight="400">省略を補う</text><text x="83" y="778" font-size="34" text-anchor="start" font-weight="400">検索条件を作る</text><rect x="515" y="630" width="370" height="230" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="543" y="682" font-size="36" text-anchor="start" font-weight="700">検索・選別</text><text x="543" y="735" font-size="34" text-anchor="start" font-weight="400">索引から候補取得</text><text x="543" y="778" font-size="34" text-anchor="start" font-weight="400">並べ替えて整形</text><rect x="975" y="630" width="370" height="230" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="1003" y="682" font-size="36" text-anchor="start" font-weight="700">生成</text><text x="1003" y="735" font-size="34" text-anchor="start" font-weight="400">根拠から回答</text><text x="1003" y="778" font-size="34" text-anchor="start" font-weight="400">引用・回答保留</text><path d="M430 315 L505 315" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M890 315 L965 315" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M430 745 L505 745" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M890 745 L965 745" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1160 435 L1160 485 L700 485 L700 618" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><text x="760" y="530" font-size="32" text-anchor="start" font-weight="400">準備済みの索引を参照</text><text x="55" y="930" font-size="32" text-anchor="start" font-weight="400">質問の準備も検索前処理。権限管理・評価・版管理は両方の層を通す。</text></g></svg>
