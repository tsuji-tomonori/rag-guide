<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">Doc-REFRAG：質問に関係する画像部分を詳しく読む</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  複数ページを取得</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">文書画像と質問を入力</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">ページごとの視覚情報を読む</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  粗い単位へ圧縮</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">視覚トークンをまとめる</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">まず少ない情報量で保持</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  質問に合う部分を選ぶ</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">学習した選択器で判定</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">必要な部分の表現を展開</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">細部の情報を取り戻す</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  画像の根拠から回答</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">詳しい部分と粗い部分を使用</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">回答品質と推論時間を評価</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">2026年8月の公開研究。選択器の学習を含む方式として比較する。</text></g></svg>
