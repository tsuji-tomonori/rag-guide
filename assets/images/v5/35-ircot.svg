<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">IRCoT：前の根拠から次の検索へ進む</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  複数段階の質問</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">A社の創業者が</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">後に設立した会社は？</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  最初の根拠を検索</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">A社の沿革を読む</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">創業者は人物Bと判明</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  次の検索文を作る</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">根拠を基に次を推論</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">人物Bが設立した会社を検索</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  根拠を結び付ける</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">人物BとC社の関係を確認</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">各段階の出典を示して回答</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">必要な根拠がそろうまで検索と推論を繰り返す。最大回数も定める。</text></g></svg>
