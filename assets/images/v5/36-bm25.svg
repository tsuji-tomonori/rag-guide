<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">BM25：語の反復と文書の長さを調整する</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  語と文書集合</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">検索語：E101</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">全3文書のうち2文書に出現</text><text x="83" y="311" font-size="34" text-anchor="start" font-weight="400">希少性の重み IDF ≈ 0.470</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  文書内の頻度</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">D1：2回、長さ8</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">D2：1回、長さ16</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">D3：0回、長さ12</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  頻度と長さを補正</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">平均長12、k1=1.2、b=0.75</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">D1：約0.713</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">D2：約0.414、D3：0</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  スコア順に並べる</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">D1 → D2 → D3</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">同じ語の追加効果は飽和</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">長さの影響はbで調整</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">説明用の値。IDF = ln(1 + (N − df + 0.5) / (df + 0.5)) を使用。</text></g></svg>
