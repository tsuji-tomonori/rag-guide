<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">READ：文書を検索し、必要な範囲を読む</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  語彙検索</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">例：2025年度の売上を検索</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">一致箇所の行番号を得る</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  構造をたどる</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">該当する節や表へ移動</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">年度と単位の見出しを探す</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  範囲を指定して読む</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">見出しと行を一緒に読む</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">例：単位は百万円</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">根拠の行範囲を保存</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  追加読解と回答</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">必要なら別範囲を読む</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">出典を示して回答する</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">操作の履歴を再現できる</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">2026年8月の公開研究。評価は一つの財務報告書と51問で行われた。</text></g></svg>
