<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">コンテキスト圧縮：短くしても条件を保つ</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  質問と根拠候補</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">質問：返品できる期間は？</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">原文：未開封なら30日以内</text><text x="83" y="311" font-size="34" text-anchor="start" font-weight="400">付属の配送説明も取得</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  必要箇所を選ぶ</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">抽出型：必要な文を残す</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">例：未開封なら30日以内</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">質問に関係する条件を保持</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  要約する方法もある</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">生成型：短い表現へ書き換え</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">原文との支持関係を検査</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">条件・数値・例外を確認</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  回答と費用を評価</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">入力トークン数を比較</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">必要な根拠の保持率を比較</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">同じ質問で回答品質を測る</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">RECOMPは抽出型と生成型を扱う。LLMLingua系はトークン選択でも圧縮する。</text></g></svg>
