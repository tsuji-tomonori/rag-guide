<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">近似重複：短い指紋から詳しい照合へ進む</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  文書を小片へ分ける</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">語や文字の連続を集合にする</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">A：{a,b,c}、B：{b,c,d}</text><text x="83" y="311" font-size="34" text-anchor="start" font-weight="400">Jaccard類似度は2/4 = 0.5</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  MinHashで候補を作る</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">同じハッシュ関数を使う</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">集合内の最小値を記録</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">一致率から重なりを推定</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  候補対を詳しく比べる</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">本文、版、日付、数値を照合</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">指紋は候補を絞るために使う</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  出所を残して統合</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">同内容なら代表へまとめる</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">内容が変わる版は分ける</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">原文と代表の対応を保存</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">SimHashでは特徴の重みをビットへ集約し、異なるビット数で候補対を探す。</text></g></svg>
