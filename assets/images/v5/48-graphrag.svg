<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">GraphRAG：要素の関係から文書群をまとめる</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  文書から関係を抽出</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">資料A：工場Xが部品Yを生産</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">資料B：部品Yを製品Zで使用</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  グラフを構築</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">工場X → 部品Y → 製品Z</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">点は要素、線は関係</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">各関係に元の出典を保持</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  コミュニティを要約</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">関係の密な集団を作る</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">集団ごとの報告を生成</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">例：製品Zの供給経路</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  質問に応じて統合</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">全体質問：集団の報告を統合</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">個別質問：関連要素をたどる</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">主張を元資料で確認</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">From Local to Globalの構成を簡略化。集団の要約はLLMが作る派生情報。</text></g></svg>
