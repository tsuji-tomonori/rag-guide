<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">MMR：関連性と新しい観点の両方で選ぶ</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  最初の候補を選ぶ</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">質問に最も近いAを選択</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">次はBとCを比較する</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  関連性と重複を測る</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">質問との類似：B=0.85, C=0.70</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">Aとの類似：B=0.95, C=0.20</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">BはAと内容が近い</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  二つの重みを計算</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">重みを0.5ずつにする例</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">B：0.5×0.85 − 0.5×0.95</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">C：0.5×0.70 − 0.5×0.20</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  次の候補を選ぶ</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">B：−0.05、C：0.25 → C</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">AとCを選択済みに加える</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">残りも同じ手順で選ぶ</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">説明用の値。実際は選択済みの全候補との最大類似度を重複の指標に使う。</text></g></svg>
