<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">Self-RAG：検索と回答を学習した評価で制御する</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  検索の必要性を判定</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">質問と生成中の文脈を読む</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">検索用の評価トークンで</text><text x="83" y="311" font-size="34" text-anchor="start" font-weight="400">次の動作を選ぶ</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  根拠候補を取得</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">必要なときに検索</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">候補の関連性を判定</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  回答候補を評価</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">根拠が回答を支持するか</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">回答が役に立つかを評価</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">学習した評価トークンを使う</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  候補を選んで続ける</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">評価を使って生成候補を選ぶ</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">必要なら次の区間でも検索</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">回答を完成させる</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">原論文は専用の学習を伴う。一般的な自己確認プロンプトとは実装条件が異なる。</text></g></svg>
