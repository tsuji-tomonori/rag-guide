<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">Corrective RAG：検索結果の評価で処理を分ける</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  最初の検索</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">質問に合う文書を取得</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">検索評価器で候補を判定</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  判定に応じて分岐</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">良好：取得文書を使う</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">不良：Web検索で補う</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">曖昧：両方の情報を使う</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  知識を選別</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">文書を細かな単位へ分ける</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">関連性を評価して残す</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">回答用の知識へまとめる</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  根拠から生成</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">選別した情報で回答</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">業務利用では外部検索の</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">送信先と権限を制御</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">検索結果の良否で補正経路を変えることが中心。評価器の誤判定も測る。</text></g></svg>
