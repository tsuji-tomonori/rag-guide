<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">ColBERT：質問の各語に一番合う文書の語を探す</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  別々に符号化</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">質問：電池／交換</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">文書：バッテリー／交換</text><text x="83" y="311" font-size="34" text-anchor="start" font-weight="400">各トークンのベクトルを作る</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  語ごとに照合</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">電池との類似度：0.9, 0.1</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">交換との類似度：0.2, 1.0</text><text x="753" y="311" font-size="34" text-anchor="start" font-weight="400">質問の語 × 文書の語で比較</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  各行の最大を選ぶ</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">電池の最大：0.9</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">交換の最大：1.0</text><text x="83" y="701" font-size="34" text-anchor="start" font-weight="400">この計算をMaxSimと呼ぶ</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  最大値を合計</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">文書のスコア：1.9</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">文書ごとに同じ計算を行い</text><text x="753" y="701" font-size="34" text-anchor="start" font-weight="400">スコア順に並べる</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">類似度は説明用の値。文書の符号化を事前計算できることが特徴。</text></g></svg>
