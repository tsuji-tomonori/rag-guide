<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#111"><text x="55" y="65" font-size="38" text-anchor="start" font-weight="700">四工程：検索の準備から根拠付きの回答まで</text><path d="M678 265 L716 265" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M678 655 L716 655" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><path d="M1035 416 L1035 460 L365 460 L365 502" fill="none" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/><rect x="55" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="172" font-size="36" text-anchor="start" font-weight="700">1  検索前処理</text><text x="83" y="225" font-size="34" text-anchor="start" font-weight="400">資料：解析・分割・索引作成</text><text x="83" y="268" font-size="34" text-anchor="start" font-weight="400">質問：省略を補い条件を作る</text><rect x="725" y="120" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="172" font-size="36" text-anchor="start" font-weight="700">2  検索</text><text x="753" y="225" font-size="34" text-anchor="start" font-weight="400">質問と条件から候補を取得</text><text x="753" y="268" font-size="34" text-anchor="start" font-weight="400">候補に出典と版を付ける</text><rect x="55" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="83" y="562" font-size="36" text-anchor="start" font-weight="700">3  検索後処理</text><text x="83" y="615" font-size="34" text-anchor="start" font-weight="400">重複をまとめて順位を調整</text><text x="83" y="658" font-size="34" text-anchor="start" font-weight="400">必要な根拠を入力へ整える</text><rect x="725" y="510" width="620" height="290" rx="16" fill="#fafafa" stroke="#444" stroke-width="3"/><text x="753" y="562" font-size="36" text-anchor="start" font-weight="700">4  生成</text><text x="753" y="615" font-size="34" text-anchor="start" font-weight="400">根拠に基づいて回答を作る</text><text x="753" y="658" font-size="34" text-anchor="start" font-weight="400">引用・確認質問・回答保留</text><text x="55" y="870" font-size="32" text-anchor="start" font-weight="400">四工程は処理の目的による分類。必要に応じて検索へ戻る構成もある。</text></g></svg>
