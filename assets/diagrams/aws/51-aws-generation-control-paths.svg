<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="850" viewBox="0 0 1200 850"><defs/><title>標準生成と根拠を制御する生成を分ける</title><rect width="100%" height="100%" fill="#FFFFFF"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="32px"><text x="40" y="63">標準生成と根拠を制御する生成を分ける</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="22px"><text x="40" y="108">AWS Cloud / 質問・回答の経路を比較する</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="20px"><text x="40" y="823">実線矢印：データの流れ。処理の担当をノード下に記載。</text></g><rect x="40" y="130" width="1120" height="280" fill="none" stroke="#adb9c2" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="23px"><text x="60" y="169.5">標準経路 / Customer-managed Knowledge Base</text></g><rect x="100" y="195" width="260" height="78" fill="#f0f4f6" stroke="#91a3b1" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="22px"><text x="230" y="244">アプリケーション</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="230" y="336.5">RetrieveAndGenerate</text></g><image x="561" y="195" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="600" y="312.5">Amazon Bedrock</text><text x="600" y="340.5">Knowledge Bases</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="600" y="376.5">検索 → 任意Rerank →</text><text x="600" y="400.5">生成モデル呼び出し</text></g><rect x="840" y="195" width="260