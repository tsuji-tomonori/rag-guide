<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="850" viewBox="0 0 1200 850"><defs/><title>AWSリソースを選ぶ四つの問い</title><rect width="100%" height="100%" fill="#FFFFFF"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="32px"><text x="40" y="63">AWSリソースを選ぶ四つの問い</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="22px"><text x="40" y="108">判断の順序：管理範囲 → 文書 → 検索 → 生成・根拠の制御</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="20px"><text x="40" y="823">矢印は選定の順序。サービス間のAPI呼び出しは示さない。</text></g><rect x="40" y="130" width="1120" height="280" fill="none" stroke="#adb9c2" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="23px"><text x="60" y="169.5">① 管理範囲と ② 文書の性質を決める</text></g><image x="291" y="195" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="330" y="326.5">どこまで任せる？</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="330" y="376.5">Managed KB /</text><text x="330" y="400.5">Customer-managed KB</text></g><image x="831" y="195" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="870" y="326.5">何を読み取る？</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="870" y="376.5">標準解析 / BDA /</text><text x="870" y="400.5">基盤モデル解析</text></g><path d="M 369 234 L 817.76 234" fill="none" stroke="#5e7e96" stroke-width="2" stroke-miterlimit="10" pointer-events="none"/><path d="M 828.76 234 L 817.76 239.5 L 817.76 228.5 Z" fill="#5e7e96" stroke="#5e7e96" stroke-width="2" stroke-miterlimit="10" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><rect fill="#FFFFFF" stroke="none" x="560" y="203" width="82" height="25" stroke-width="0"/><text x="600" y="223">次に確認</text></g><rect x="40" y="430" width="1120" height="280" fill="none" stroke="#adb9c2" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="23px"><text x="60" y="469.5">③ 検索要件と ④ 根拠制御の要件を決める</text></g><image x="291" y="495" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="330" y="626.5">何を検索する？</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="330" y="676.5">意味：S3 Vectors</text><text x="330" y="700.5">語彙 + 意味：OpenSearch</text></g><image x="831" y="495" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="870" y="626.5">どこまで制御する？</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="870" y="676.5">RetrieveAndGenerate /</text><text x="870" y="700.5">Retrieve + Converse</text></g><path d="M 369 534 L 817.76 534" fill="none" stroke="#5e7e96" stroke-width="2" stroke-miterlimit="10" pointer-events="none"/><path d="M 828.76 534 L 817.76 539.5 L 817.76 528.5 Z" fill="#5e7e96" stroke="#5e7e96" stroke-width="2" stroke-miterlimit="10" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><rect fill="#FFFFFF" stroke="none" x="560" y="503" width="82" height="25" stroke-width="0"/><text x="600" y="523">次に確認</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="21px"><text x="60" y="771.5">独自化する理由：複数検索器の統合、厳密なACL、根拠の採否・検証を制御したい。</text></g></svg>
