<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="650" viewBox="0 0 1200 650"><defs/><title>検索要件でベクトルストアを選ぶ</title><rect width="100%" height="100%" fill="#FFFFFF"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="32px"><text x="40" y="63">検索要件でベクトルストアを選ぶ</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="22px"><text x="40" y="108">AWS Cloud / ストアの比較：一方を選ぶ構成例</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="20px"><text x="40" y="623">比較図のため矢印なし。両ストアを直列に接続する意味ではない。</text></g><rect x="40" y="130" width="1120" height="320" fill="none" stroke="#adb9c2" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="23px"><text x="60" y="169.5">検索対象と評価条件を固定して比較する</text></g><image x="291" y="195" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="330" y="326.5">Amazon S3 Vectors</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="330" y="376.5">意味類似を中心に検索</text><text x="330" y="400.5">ベクトル + メタデータ</text></g><image x="831" y="195" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="870" y="312.5">Amazon OpenSearch</text><text x="870" y="340.5">Serverless</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="870" y="376.5">語彙一致 + 意味類似</text><text x="870" y="400.5">ハイブリッド検索</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="21px"><text x="60" y="511.5">Customer-managed KB + S3 Vectors：SEMANTIC。</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="21px"><text x="60" y="566.5">HYBRIDは対応ストア・テキスト項目の条件を確認する。Recall・応答時間・費用で比較。</text></g></svg>
