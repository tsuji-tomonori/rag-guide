<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="850" viewBox="0 0 1200 850"><defs/><title>認可・暗号化・観測を全工程に適用する</title><rect width="100%" height="100%" fill="#FFFFFF"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="32px"><text x="40" y="63">認可・暗号化・観測を全工程に適用する</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="22px"><text x="40" y="108">AWS Cloud / 横断する管理機能と、利用者が設計する運用規則</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="20px"><text x="40" y="823">各段は管理対象の対応。APIの呼び出し順を表す矢印は置かない。</text></g><rect x="40" y="130" width="1120" height="280" fill="none" stroke="#adb9c2" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="23px"><text x="60" y="169.5">① アクセスとデータを保護する</text></g><image x="191" y="195" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="230" y="326.5">AWS IAM</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="230" y="388.5">API主体・ロール・権限</text></g><image x="561" y="195" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="600" y="326.5">AWS KMS</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="600" y="388.5">原文・索引・ログの暗号化</text></g><rect x="840" y="195" width="260" height="78" fill="#f0f4f6" stroke="#91a3b1" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="22px"><text x="970" y="244">文書・ツールの認可</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="970" y="336.5">フィルター・ACL・業務規則</text></g><rect x="40" y="430" width="1120" height="280" fill="none" stroke="#adb9c2" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" font-size="23px"><text x="60" y="469.5">② 変更と実行を追跡する</text></g><image x="191" y="495" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="230" y="626.5">Amazon CloudWatch</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="230" y="688.5">ログ・指標・アラーム</text></g><image x="561" y="495" width="78" height="78" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="23px"><text x="600" y="626.5">AWS CloudTrail</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="600" y="688.5">APIの監査記録</text></g><rect x="840" y="495" width="260" height="78" fill="#f0f4f6" stroke="#91a3b1" stroke-width="1.5" pointer-events="none"/><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="22px"><text x="970" y="544">評価・版・費用</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" text-anchor="middle" font-size="20px"><text x="970" y="624.5">回帰評価・公開条件</text><text x="970" y="648.5">設定版・費用配賦</text></g><g fill="#2B3A4A" font-family="Noto Sans CJK JP" pointer-events="none" font-size="21px"><text x="60" y="771.5">Batch LayerとReal-time Layerの両方が対象。IAMだけで文書単位の閲覧権限は決まらない。</text></g></svg>
