<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS RAGハンズオンの物理構成</title>
  <desc id="desc">S3、Amazon Bedrock Knowledge Bases、S3 Vectors、Retrieve、Converseのデータフローを示す構成図</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b7d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; fill: #17324d; }
      .title { font-size: 30px; font-weight: 800; }
      .subtitle { font-size: 16px; fill: #5c7384; }
      .boundary { fill: #fbfcfb; stroke: #9eb2bf; stroke-width: 2; stroke-dasharray: 10 8; }
      .lane { fill: #f2f6f7; stroke: #c2d0d8; stroke-width: 1.5; }
      .lane-title { font-size: 18px; font-weight: 800; fill: #315b7d; }
      .lane-note { font-size: 13px; fill: #6d8290; }
      .card { fill: #ffffff; stroke: #c5d4dc; stroke-width: 2; }
      .card-title { font-size: 17px; font-weight: 800; }
      .card-subtitle { font-size: 13px; fill: #617786; }
      .mini { font-size: 12px; fill: #5f7380; }
      .icon-label { font-size: 20px; font-weight: 900; fill: #ffffff; text-anchor: middle; }
      .section-label { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; fill: #ffffff; }
      .edge { fill: none; stroke: #315b7d; stroke-width: 3; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #779a8d; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .edge-label { font-size: 13px; fill: #315b7d; font-weight: 700; paint-order: stroke; stroke: #f7f6f1; stroke-width: 5px; stroke-linejoin: round; }
      .legend { font-size: 13px; fill: #587080; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f7f6f1"/>
  <text x="42" y="52" class="title">物理構成｜AWS RAG ハンズオン</text>
  <text x="42" y="80" class="subtitle">実際に作成するリソースと、文書取り込み・質問回答のデータフロー</text>

  <rect x="42" y="112" width="24" height="14" rx="3" fill="#2fa9a1"/>
  <text x="76" y="124" class="legend">AWSマネージドサービス</text>
  <line x1="286" y1="119" x2="316" y2="119" class="edge-dashed"/>
  <text x="330" y="124" class="legend">参照関係</text>

  <rect x="292" y="150" width="1268" height="686" rx="24" class="boundary"/>
  <rect x="318" y="132" width="250" height="38" rx="19" fill="#315b7d"/>
  <text x="443" y="157" class="section-label" text-anchor="middle">AWS Cloud｜ap-northeast-1</text>

  <g filter="url(#shadow)">
    <rect x="30" y="540" width="205" height="138" rx="16" class="card"/>
    <circle cx="78" cy="589" r="22" fill="#5e7e96"/>
    <circle cx="78" cy="578" r="8" fill="#ffffff"/>
    <path d="M58 615 Q78 592 98 615" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <text x="114" y="586" class="card-title">受講者</text>
    <text x="114" y="613" class="card-subtitle">質問を入力</text>
    <text x="114" y="633" class="card-subtitle">回答を受け取る</text>
  </g>

  <rect x="570" y="188" width="955" height="252" rx="18" class="lane"/>
  <text x="596" y="220" class="lane-title">Batch Layer｜文書取り込み</text>
  <text x="596" y="242" class="lane-note">curlで取得したPDFを取り込み、検索用のベクトルindexを作成</text>

  <g filter="url(#shadow)">
    <rect x="590" y="280" width="194" height="122" rx="13" class="card"/>
    <image x="612" y="303" width="52" height="52" href="aws-icons/amazon-s3-48.svg" xlink:href="aws-icons/amazon-s3-48.svg" preserveAspectRatio="xMidYMid meet"/>
    <text x="678" y="321" class="card-title">Amazon S3</text>
    <text x="678" y="345" class="card-subtitle">source bucket</text>
    <text x="612" y="380" class="mini">日本語PDF・metadata</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="253" width="298" height="176" rx="13" class="card"/>
    <image x="873" y="278" width="58" height="58" href="aws-icons/amazon-bedrock-48.svg" xlink:href="aws-icons/amazon-bedrock-48.svg" preserveAspectRatio="xMidYMid meet"/>
    <text x="947" y="297" class="card-title">Amazon Bedrock</text>
    <text x="947" y="321" class="card-subtitle">Knowledge Bases</text>
    <rect x="873" y="351" width="108" height="28" rx="8" fill="#eaf5f3"/>
    <text x="927" y="370" class="mini" text-anchor="middle">Data source</text>
    <rect x="990" y="351" width="105" height="28" rx="8" fill="#eaf5f3"/>
    <text x="1042" y="370" class="mini" text-anchor="middle">Ingestion job</text>
    <text x="873" y="405" class="mini">parser・chunking・embedding</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1240" y="280" width="238" height="122" rx="13" class="card"/>
    <image x="1262" y="303" width="52" height="52" href="aws-icons/s3-vectors-48.svg" xlink:href="aws-icons/s3-vectors-48.svg" preserveAspectRatio="xMidYMid meet"/>
    <text x="1328" y="321" class="card-title">S3 Vectors</text>
    <text x="1328" y="345" class="card-subtitle">vector bucket</text>
    <text x="1262" y="380" class="mini">index：1024 / cosine</text>
  </g>

  <path d="M784 341 H850" class="edge"/>
  <text x="794" y="324" class="edge-label">文書取り込み</text>
  <path d="M1148 341 H1240" class="edge"/>
  <text x="1160" y="324" class="edge-label">embedding・保存</text>

  <rect x="570" y="486" width="955" height="293" rx="18" class="lane"/>
  <text x="596" y="518" class="lane-title">Real-time Layer｜質問・回答</text>
  <text x="596" y="540" class="lane-note">Retrieveで根拠を確認した後、Evidence SetだけをConverseへ渡す</text>

  <g filter="url(#shadow)">
    <rect x="590" y="584" width="205" height="132" rx="13" class="card"/>
    <image x="612" y="608" width="52" height="52" href="aws-icons/amazon-bedrock-48.svg" xlink:href="aws-icons/amazon-bedrock-48.svg" preserveAspectRatio="xMidYMid meet"/>
    <text x="678" y="620" class="card-title">Knowledge</text>
    <text x="678" y="642" class="card-title">Bases</text>
    <text x="678" y="663" class="card-subtitle">Retrieve API</text>
    <text x="612" y="692" class="mini">検索条件・numberOfResults</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="584" width="205" height="132" rx="13" class="card"/>
    <image x="857" y="608" width="52" height="52" href="aws-icons/s3-vectors-48.svg" xlink:href="aws-icons/s3-vectors-48.svg" preserveAspectRatio="xMidYMid meet"/>
    <text x="923" y="625" class="card-title">S3 Vectors</text>
    <text x="923" y="649" class="card-subtitle">semantic search</text>
    <text x="857" y="692" class="mini">ベクトルindexを参照</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="584" width="180" height="132" rx="13" class="card"/>
    <rect x="1102" y="608" width="52" height="52" rx="11" fill="#5e7e96"/>
    <path d="M1115 625 h26 v22 h-26 z M1121 620 h14 M1121 631 h14 M1121 639 h9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="1168" y="620" class="card-title">Evidence</text>
    <text x="1168" y="642" class="card-title">Set</text>
    <text x="1168" y="663" class="card-subtitle">根拠チャンク</text>
    <text x="1102" y="692" class="mini">text・score・source URI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1300" y="560" width="205" height="180" rx="13" class="card"/>
    <image x="1322" y="584" width="52" height="52" href="aws-icons/amazon-bedrock-48.svg" xlink:href="aws-icons/amazon-bedrock-48.svg" preserveAspectRatio="xMidYMid meet"/>
    <text x="1388" y="600" class="card-title">Bedrock</text>
    <text x="1388" y="622" class="card-title">Converse</text>
    <text x="1388" y="644" class="card-subtitle">Amazon Nova Lite</text>
    <rect x="1322" y="662" width="160" height="32" rx="8" fill="#eaf5f3"/>
    <text x="1402" y="683" class="mini" text-anchor="middle">根拠付きの回答</text>
    <text x="1322" y="722" class="mini">モデルアクセスを事前確認</text>
  </g>

  <path d="M235 604 H430 V650 H590" class="edge"/>
  <text x="284" y="590" class="edge-label">質問</text>
  <path d="M795 650 H835" class="edge"/>
  <text x="798" y="632" class="edge-label">検索</text>
  <path d="M1040 650 H1080" class="edge"/>
  <text x="1043" y="632" class="edge-label">候補</text>
  <path d="M1260 650 H1300" class="edge"/>
  <text x="1260" y="632" class="edge-label">context</text>
  <path d="M1370 402 V525" class="edge-dashed"/>
  <text x="1382" y="480" class="edge-label">同じindex</text>
  <path d="M1505 650 H1550 V820 H180 V678" class="edge"/>
  <text x="1510" y="637" class="edge-label">回答</text>
  <text x="42" y="870" class="subtitle">実習で作成する主なリソース：S3 source bucket、S3 Vectors bucket / index、Knowledge Base、data source</text>
</svg>
