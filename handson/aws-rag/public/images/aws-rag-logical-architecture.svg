      .control { fill: #f4f1f8; stroke: #c2b4d8; }
      .lane-title { font-size: 20px; font-weight: 800; }
      .lane-note { font-size: 13px; fill: #617786; }
      .logical-card { fill: #ffffff; stroke: #c5d4dc; stroke-width: 2; }
      .logical-title { font-size: 16px; font-weight: 800; }
      .logical-note { font-size: 12px; fill: #667c88; }
      .resource-card { fill: #ffffff; stroke: #c5d4dc; stroke-width: 2; }
      .resource-title { font-size: 14px; font-weight: 800; }
      .resource-note { font-size: 12px; fill: #667c88; }
      .resource-tag { font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .icon-label { font-size: 18px; font-weight: 900; fill: #ffffff; text-anchor: middle; }
      .process-edge { fill: none; stroke: #315b7d; stroke-width: 3; marker-end: url(#arrow); }
      .legend { font-size: 13px; fill: #587080; }
      .aws-badge { fill: #eaf5f3; stroke: #b4d4ca; stroke-width: 1; }
      .aws-badge-text { font-size: 10.5px; fill: #356f5b; font-weight: 800; text-anchor: middle; }
    </style>
