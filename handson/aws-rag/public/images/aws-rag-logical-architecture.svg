      .subtitle { font-size: 16px; fill: #5c7384; }
      .panel { fill: #fbfcfb; stroke: #9eb2bf; stroke-width: 2; stroke-dasharray: 10 8; }
      .lane { stroke-width: 2; }
      .batch { fill: #eef5f2; stroke: #9db9ae; }
