  <rect width="1600" height="1050" fill="#f7f6f1"/>
  <text x="42" y="52" class="title">論理構成｜RAGの責務とAWSリソースの対応</text>
  <text x="42" y="80" class="subtitle">「どの処理を行うか」と「どのAWSリソースで実現するか」を同じ図で確認します</text>

  <line x1="42" y1="112" x2="72" y2="112" class="process-edge"/>
  <text x="84" y="117" class="legend">論理処理の順序</text>
  <rect x="230" y="105" width="30" height="14" rx="7" class="aws-badge"/>
  <text x="274" y="117" class="legend">各論理カード内のAWSタグで対応を表示</text>

  <rect x="32" y="142" width="1000" height="850" rx="22" class="panel"/>
  <rect x="1058" y="142" width="510" height="850" rx="22" class="panel"/>
  <rect x="58" y="123" width="190" height="38" rx="19" fill="#315b7d"/>
  <text x="153" y="148" class="resource-tag" font-size="13">論理構成</text>
