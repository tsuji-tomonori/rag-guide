<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">AWS RAGハンズオンの論理構成とAWSリソースの対応</title>
  <desc id="desc">Batch Layer、Real-time Layer、Control Planeの論理構成と対応するAWSリソースを示す図</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b7d"/>
    </marker>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#779a8d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; fill: #17324d; }
      .title { font-size: 30px; font-weight: 800; }
      .subtitle { font-size: 16px; fill: #5c7384; }
      .panel { fill: #fbfcfb; stroke: #9eb2bf; stroke-width: 2; stroke-dasharray: 10 8; }
      .lane { stroke-width: 2; }
      .batch { fill: #eef5f2; stroke: #9db9ae; }
      .online { fill: #eef3f8; stroke: #a7bfd1; }
      .control { fill: #f4f1f8; stroke: #c2b4d8; }
      .lane-title { font-size: 20px; font-weight: 800; }
      .lane-note { font-size: 13px; fill: #617786; }
      .logical-card { fill: #ffffff; stroke: #c5d4dc; stroke-width: 2; }
      .logical-title { font-size: 16px; font-weight: 800; }
      .logical-note { font-size: 12px; fill: #667c88; }
      .resource-card { fill: #ffffff; stroke: #c5d4dc; stroke-width: 2; }
      .resource-title { font-size: 14px; font-weight: 800; }
      .resource-note { font-size: 12px; fill: #667c88; }
      .resource-tag { font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .icon-label { font-size: 18px; font-weight: 900; fill: #ffffff; text-anchor: middle; }
      .process-edge { fill: none; stroke: #315b7d; stroke-width: 3; marker-end: url(#arrow); }
      .map-edge { fill: none; stroke: #779a8d; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#map-arrow); }
      .legend { font-size: 13px; fill: #587080; }
      .map-label { font-size: 12px; fill: #648274; font-weight: 700; paint-order: stroke; stroke: #f7f6f1; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f7f6f1"/>
  <text x="42" y="52" class="title">論理構成｜RAGの責務とAWSリソースの対応</text>
  <text x="42" y="80" class="subtitle">「どの処理を行うか」と「どのAWSリソースで実現するか」を同じ図で確認します</text>

  <line x1="42" y1="112" x2="72" y2="112" class="process-edge"/>
  <text x="84" y="117" class="legend">論理処理の順序</text>
  <line x1="230" y1="112" x2="260" y2="112" class="map-edge"/>
  <text x="274" y="117" class="legend">AWSリソースとの対応</text>

  <rect x="32" y="142" width="1000" height="850" rx="22" class="panel"/>
  <rect x="1058" y="142" width="510" height="850" rx="22" class="panel"/>
  <rect x="58" y="123" width="190" height="38" rx="19" fill="#315b7d"/>
