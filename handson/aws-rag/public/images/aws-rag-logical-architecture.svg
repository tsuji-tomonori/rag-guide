    <circle cx="526" cy="305" r="4" fill="#ffffff"/><circle cx="537" cy="305" r="4" fill="#ffffff"/><circle cx="531" cy="317" r="4" fill="#ffffff"/>
    <path d="M529 308 L534 308 M528 308 L530 314" stroke="#ffffff" stroke-width="2"/>
